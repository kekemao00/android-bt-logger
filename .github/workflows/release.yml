name: Release

# 推送 v*.*.* 格式的 tag 时自动构建并发布 GitHub Release。
# 也可在 Actions 页面手动触发：填入版本号（如 v1.3.0），tag 不存在时会基于所选提交自动创建，
# 不需要在本地打 tag。
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本 tag（如 v1.3.0）；不存在时自动创建'
        required: true
      target:
        description: 'tag 不存在时基于哪个分支/提交创建'
        required: false
        default: 'main'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # softprops/action-gh-release 创建 Release 需要 contents 写权限
    permissions:
      contents: write
    # Why: step-level `if` 不能直接读取 secrets，先在 job env 里做存在性检查。
    env:
      HAS_RELEASE_SIGNING_SECRETS: ${{ secrets.KEYSTORE_FILE != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' && secrets.KEY_ALIAS != '' }}

    steps:
      - name: Resolve tag
        id: version
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          # versionName 去掉前缀 v，与 app/build.gradle 中的默认格式一致
          echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史与 tag，用于生成 changelog

      # 手动触发且 tag 尚不存在时，在 target 上创建并推送 tag；
      # 用 GITHUB_TOKEN 推送的 tag 不会再次触发本工作流，不会重复发布
      - name: Checkout or create tag
        env:
          TAG: ${{ steps.version.outputs.TAG }}
          TARGET: ${{ github.event.inputs.target || 'main' }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag 必须形如 v1.3.0，实际为 '$TAG'"
            exit 1
          fi
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "使用已有 tag $TAG"
          else
            git fetch origin "$TARGET"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" FETCH_HEAD -m "BtLogger $TAG"
            git push origin "refs/tags/$TAG"
            echo "已在 $TARGET 上创建 tag $TAG"
          fi
          git checkout -q "refs/tags/$TAG"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Why: ubuntu-latest 已预装 Android SDK（ANDROID_HOME 已设置）；
      # android-actions/setup-android 默认安装已下架的 `tools` 包会直接失败，
      # 这正是 v1.1.0 ~ v1.2.1 发布全部失败的原因。

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew 在仓库中未带可执行位，tag 上的旧提交同样如此
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace
        env:
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}

      # app/build.gradle 将 APK 重命名为
      # BtLogger-{variant}-v{versionName}-{versionCode}({applicationId}).apk
      - name: Locate APKs
        id: locate
        run: |
          set -euo pipefail
          DEBUG_APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
          RELEASE_APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$DEBUG_APK" ] || [ -z "$RELEASE_APK" ]; then
            echo "::error::未找到构建产物: DEBUG_APK='$DEBUG_APK' RELEASE_APK='$RELEASE_APK'"
            ls -R app/build/outputs/apk || true
            exit 1
          fi
          echo "DEBUG_APK=$DEBUG_APK" >> "$GITHUB_OUTPUT"
          echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_OUTPUT"

      # Why: apksigner 生成 v2+ 签名（targetSdk 30+ 必需）；密码通过 env: 读取，
      # 避免出现在进程命令行中。
      - name: Sign release APK
        if: ${{ env.HAS_RELEASE_SIGNING_SECRETS == 'true' }}
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_APK: ${{ steps.locate.outputs.RELEASE_APK }}
        run: |
          set -euo pipefail
          trap 'rm -f keystore.jks' EXIT
          printf '%s' "$KEYSTORE_FILE" | base64 -d > keystore.jks
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::未找到 apksigner"
            exit 1
          fi
          "$APKSIGNER" sign \
            --ks keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            "$RELEASE_APK"
          "$APKSIGNER" verify --verbose "$RELEASE_APK"

      # Why: 未配置签名时，unsigned 的 release APK 无法安装，不能上传；
      # 但也不应让整个发布失败，此时只发布可直接安装的 debug APK，并在说明中注明。
      - name: Collect release assets
        id: assets
        env:
          DEBUG_APK: ${{ steps.locate.outputs.DEBUG_APK }}
          RELEASE_APK: ${{ steps.locate.outputs.RELEASE_APK }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$DEBUG_APK" dist/
          if [ "$HAS_RELEASE_SIGNING_SECRETS" = "true" ]; then
            cp "$RELEASE_APK" dist/
            echo "SIGNING_NOTE=- **Release APK**：正式签名，推荐安装" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::未配置签名 Secrets（KEYSTORE_FILE/KEYSTORE_PASSWORD/KEY_PASSWORD/KEY_ALIAS），本次只发布 debug APK"
            echo "SIGNING_NOTE=- 本次未配置正式签名，仅提供 debug APK" >> "$GITHUB_OUTPUT"
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -l dist

      # 按 Conventional Commits 类型分组生成更新日志
      - name: Generate changelog
        env:
          TAG: ${{ steps.version.outputs.TAG }}
        run: |
          set -euo pipefail
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          RANGE="${PREVIOUS_TAG:+${PREVIOUS_TAG}..}${TAG}"
          git log "$RANGE" --no-merges --pretty=format:'%s' > commits.txt || true
          section() {
            local title="$1" pattern="$2"
            local lines
            lines=$(grep -E "$pattern" commits.txt || true)
            if [ -n "$lines" ]; then
              printf '### %s\n%s\n\n' "$title" "$(printf '%s\n' "$lines" | sed 's/^/- /')"
            fi
          }
          {
            section "✨ 新功能" '^feat(\(.+\))?!?:'
            section "🐛 问题修复" '^fix(\(.+\))?!?:'
            section "⚡ 优化与重构" '^(perf|refactor|style)(\(.+\))?!?:'
            section "🔧 其他" '^(build|ci|chore|docs|test)(\(.+\))?!?:'
            others=$(grep -vE '^(feat|fix|perf|refactor|style|build|ci|chore|docs|test)(\(.+\))?!?:' commits.txt || true)
            if [ -n "$others" ]; then
              printf '### 📝 其他提交\n%s\n\n' "$(printf '%s\n' "$others" | sed 's/^/- /')"
            fi
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "**完整变更**：https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${TAG}"
            fi
          } > CHANGELOG_BODY.md
          cat CHANGELOG_BODY.md

      - name: Compose release notes
        env:
          TAG: ${{ steps.version.outputs.TAG }}
          BUILD_DATE: ${{ steps.version.outputs.BUILD_DATE }}
          SIGNING_NOTE: ${{ steps.assets.outputs.SIGNING_NOTE }}
        run: |
          {
            echo "## BtLogger ${TAG}"
            echo
            echo "### 📱 下载"
            echo "$SIGNING_NOTE"
            echo "- **Debug APK**：调试版本，日志更完整"
            echo "- \`SHA256SUMS.txt\`：校验文件完整性"
            echo
            cat CHANGELOG_BODY.md
            echo
            echo "---"
            echo "构建时间：${BUILD_DATE} · Commit：\`$(git rev-parse --short HEAD)\`"
          } > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: BtLogger ${{ steps.version.outputs.TAG }}
          body_path: RELEASE_NOTES.md
          files: dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BtLogger-${{ steps.version.outputs.TAG }}
          path: dist/*
          retention-days: 30
