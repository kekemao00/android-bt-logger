name: CI

# Why: 发布流水线只在打 tag 时运行，过去多次发布才暴露构建失败。
# 每次 push / PR 都跑一遍构建与单元测试，让问题在合入前暴露。
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Why: ubuntu-latest 已预装 Android SDK（ANDROID_HOME 已设置）；
      # android-actions/setup-android 默认安装已下架的 `tools` 包会直接失败。

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Why: 应用内更新依赖每次构建的 debug 包签名一致，在合入前就发现签名配置被改动
      - name: Verify debug APK signing key
        env:
          EXPECTED_CERT_SHA256: 76a9a03a5e38848584549fa8b6057fdd8602e77ef3150eece7ac6af1e413f894
        run: |
          set -euo pipefail
          DEBUG_APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$DEBUG_APK" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          echo "debug APK 证书 SHA-256: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::debug APK 签名证书与 app/debug.keystore 不一致"
            exit 1
          fi

      # Why: Android 15+ 的 16 KB 页面设备要求 APK 内未压缩的 .so 按 16 KB 对齐，
      # 否则安装后弹出兼容性警告（v1.5.0 即因 AGP 8.2.2 只按 4 KB 对齐而触发）
      - name: Verify 16 KB page alignment
        run: |
          set -euo pipefail
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)"
          for APK in app/build/outputs/apk/debug/*.apk; do
            if ! "$ZIPALIGN" -c -P 16 -v 4 "$APK" > zipalign.log; then
              grep -v ' (OK' zipalign.log || true
              echo "::error::$APK 未通过 16 KB 页面对齐校验"
              exit 1
            fi
            echo "$APK 通过 16 KB 页面对齐校验"
          done

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BtLogger-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
